services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - web
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_CONFIG=${FLASK_CONFIG:-development}
      - DEVELOPMENT_DATABASE_URL=${DEVELOPMENT_DATABASE_URL}
      - PRODUCTION_DATABASE_URL=${PRODUCTION_DATABASE_URL}
      - STAGING_DATABASE_URL=${STAGING_DATABASE_URL}
      - TEST_DATABASE_URL=${TEST_DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - FLASK_APP=app.py
      # Add other environment variables as needed
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-eveshop}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-eveshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eveshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: